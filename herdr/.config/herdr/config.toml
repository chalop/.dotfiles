onboarding = false

[ui.toast]
delivery = "system"

[theme]
name = "dracula"
auto_switch = false

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "local.last-workspace.toggle"
description = "jump to the last workspace"
